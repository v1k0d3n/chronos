version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Kubernetes field names ("status", "data", "metadata") recur by nature;
      # a constant for each would name the obvious. Flag only real repetition.
      min-len: 5
      min-occurrences: 4
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      # A test that spells out its fixtures is clearer than one that hides
      # them behind constants named after their values.
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
      # npm dependencies of the console plugin. Some ship Go sources, which are
      # not ours to lint or fix.
      - console-plugin/node_modules
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - console-plugin/node_modules
