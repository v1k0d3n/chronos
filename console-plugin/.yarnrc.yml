enableInlineBuilds: true

enableScripts: false

enableTelemetry: false

httpTimeout: 600000

nodeLinker: node-modules

supportedArchitectures:
  cpu:
    - x64
    - arm64
    - s390x
    - ppc64
  os:
    - linux
    - darwin

yarnPath: .yarn/releases/yarn-4.14.1.cjs

# react-router is a shared module: at runtime the plugin uses the console's
# copy, never its own, and the console SDK pins the version to match the
# console release (~7.13.1 for 4.22). Advisories against it therefore do not
# ship in this plugin, and upgrading past the SDK's range would only make the
# types lie. Revisit when the SDK moves.
npmAuditExcludePackages:
  - react-router
