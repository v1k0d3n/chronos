apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The "Acme Storefront" — a three-tier sample app for demonstrating Chronos:
#   web (presentation) → api (application) → db (data)
# Deploy with:  oc apply -k docs/demo
# See README.md for the full step-by-step demo script.
namespace: demo-chronos

resources:
  - namespace.yaml
  - rbac.yaml
  - db.yaml
  - api.yaml
  - web.yaml
