# ── API TIER (application) ─────────────────────────────────────────────────
# The internal catalog service. Its config (feature flags) lives in a ConfigMap,
# so a "flip a feature flag" change is captured by Chronos with a clean diff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: acme-storefront
data:
  LOG_LEVEL: "info"
  FEATURE_RECOMMENDATIONS: "true"
  FEATURE_SUMMER_SALE: "false"
  MAX_CART_ITEMS: "50"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: acme-storefront
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: acme-storefront
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: api-config }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: acme-storefront
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - port: 8080
      targetPort: 8080
