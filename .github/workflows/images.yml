name: Images

# Builds the three images and publishes them to quay.io/bjozsa-redhat.
#
# Pull requests build but never push, and never see the registry credentials:
# this runs on `pull_request`, not `pull_request_target`, so a PR cannot
# exfiltrate them. Pushes to main publish `main` and `sha-<short>` tags; a
# `v*` tag publishes the version tag and moves `latest`. Every published image
# is signed with cosign (keyless, bound to this workflow's identity).
#
# Credentials: QUAY_USERNAME / QUAY_PASSWORD are a quay robot account with
# write access to the three repositories and nothing else.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: quay.io/bjozsa-redhat

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chronos-operator
            context: .
            file: Containerfile
          - image: chronos-mcp-server
            context: .
            file: Containerfile.mcp-server
          - image: chronos-console-plugin
            context: console-plugin
            file: console-plugin/Containerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # `latest` only from a release tag; main gets `main` and a sha.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - if: github.event_name != 'pull_request'
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
