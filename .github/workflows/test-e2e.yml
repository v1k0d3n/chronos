name: E2E Tests

# On demand for now. The suite runs on a Kind cluster, and the default
# manifests get their certificates from OpenShift's service-ca, which Kind
# does not have: the reverter's webhook certificate is never minted and the
# pod never starts. Until a cert-manager path exists for non-OpenShift
# clusters, running this on every push would only ever be red.
on:
  workflow_dispatch:

# Nothing here writes to the repository; say so, or the default token could.
permissions:
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
