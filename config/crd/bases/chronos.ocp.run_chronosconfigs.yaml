                        lists, these add to what is inherited rather than replacing it.
                      items:
                        type: string
                      type: array
                  required:
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                x-kubernetes-list-type: map
            type: object
