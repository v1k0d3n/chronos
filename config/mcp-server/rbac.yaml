apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: mcp-server
---
# The server's own identity authenticates callers and acts as them.
#
# It holds no read access to Chronos data in its own right: a query answered
# under this identity would get 403. What it does hold is `impersonate`, so
# that a caller's audience-scoped token -- one the API server itself refuses,
# and so one that is worthless if leaked -- can still produce a query that
# runs under that caller's own RBAC. The server impersonates only an identity
# the API server has just authenticated by TokenReview, never one a caller
# names; that bound is enforced by the code and its tests, not by RBAC, and
# it is the reason this ServiceAccount must be treated as sensitive.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-role
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: mcp-server
rules:
  # Authenticate a caller's bearer token.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Act as the authenticated caller: their name, groups, UID, and the OpenShift
  # OAuth scopes that limit what their token may do.
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["uids", "userextras/scopes.authorization.openshift.io"]
    verbs: ["impersonate"]
---
# Grant this to users or agents that should be able to query the timeline.
# Bind it namespace-scoped to limit a caller to one namespace, or cluster-wide
# for a fleet-level view. This binding — not the server — decides what a given
# caller can see.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-timeline-reader
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: mcp-server
rules:
  - apiGroups: ["chronos.ocp.run"]
    resources:
      - changeevents
      - resourcesnapshots
      # Readable so a caller can tell a change was already reverted. No verb
      # here could create one.
      - revertoperations
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-rolebinding
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-role
subjects:
  - kind: ServiceAccount
    name: mcp-server
    # No namespace here on purpose: kustomize fills it in, and only then does
    # it also apply the name prefix to this reference. With the namespace
    # written out, the reference was left unprefixed when this kustomization
    # was included from an overlay -- binding a ServiceAccount that does not
    # exist, silently.
