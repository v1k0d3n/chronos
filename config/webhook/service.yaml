apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/managed-by: kustomize
  name: webhook-service
  namespace: system
  annotations:
    # Ask OpenShift's service-ca to mint the webhook's serving certificate into
    # this secret, and keep it rotated. No cert-manager required.
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: chronos
    chronos.ocp.run/role: reverter
