---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-chronos-ocp-run-v1alpha1-revertoperation
  failurePolicy: Fail
  name: mrevertoperation.chronos.ocp.run
  rules:
  - apiGroups:
    - chronos.ocp.run
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - revertoperations
  sideEffects: None
