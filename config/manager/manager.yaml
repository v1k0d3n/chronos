        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --role=reverter
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: quay.io/bjozsa-redhat/chronos-operator:latest
        name: reverter
        # env:
        #   - name: CHRONOS_WATCH_NAMESPACES   # equivalent to --watch-namespaces
        #     value: team-a,team-b,payments
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # When watching cluster-wide, Chronos runs dynamic informers over every
        # configmap, secret, deployment, RBAC object, etc. — the caches need real
        # memory (the default 128Mi OOMKills at startup). On large clusters,
        # scope the watch with --watch-namespaces (above) instead of raising this.
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 128Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: reverter
      terminationGracePeriodSeconds: 10
