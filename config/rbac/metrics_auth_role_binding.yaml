apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-auth-role
subjects:
- kind: ServiceAccount
  name: watcher
  namespace: system
- kind: ServiceAccount
  name: correlator
  namespace: system
- kind: ServiceAccount
  name: reverter
  namespace: system
