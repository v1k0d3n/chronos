  verbs:
  - create
  - get
  - patch
  - update
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - chronos.ocp.run
  resources:
  - changeevents
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - chronos.ocp.run
  resources:
  - changeevents/status
