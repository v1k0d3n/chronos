apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/managed-by: kustomize
    chronos.ocp.run/role: watcher
  name: watcher
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/managed-by: kustomize
  name: watcher-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: watcher-role
subjects:
- kind: ServiceAccount
  name: watcher
  namespace: system
---
# The watcher's namespaced permissions (creating the redaction key Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/managed-by: kustomize
  name: watcher-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watcher-role
subjects:
- kind: ServiceAccount
  name: watcher
  namespace: system
