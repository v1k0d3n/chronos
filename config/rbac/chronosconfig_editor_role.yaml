# This rule is not used by the project chronos itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the chronos.ocp.run.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/managed-by: kustomize
  name: chronosconfig-editor-role
rules:
- apiGroups:
  - chronos.ocp.run
  resources:
  - chronosconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - chronos.ocp.run
  resources:
  - chronosconfigs/status
  verbs:
  - get
